<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokerPEPAE&amp;Fri">
<meta name="theme-color" content="#07241b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>PokerPEPAE&amp;Fri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07241b; --bg2:#0b2f23; --felt1:#17805a; --felt2:#0c4b34; --rail:#4a2e1b;
  --gold:#f4c95d; --gold2:#d79a1e; --red:#ef4a55; --ink:#eaf6ef; --mute:#8db5a2; --line:rgba(255,255,255,.1);
  --card:#fbfaf5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit',system-ui,-apple-system,'Sukhumvit Set',sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#0f3a2b 0%,var(--bg) 60%)}
button,input,select{font:inherit;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:560px;margin:0 auto;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* ---------- ปุ่ม ---------- */
.b{height:48px;border:0;border-radius:12px;padding:0 14px;font-weight:600;font-size:16px;background:#1b4a39;color:var(--ink);cursor:pointer;transition:transform .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b:active{transform:scale(.97)}
.b[disabled]{opacity:.4;pointer-events:none}
.b.gold{background:linear-gradient(#f8d675,var(--gold2));color:#2a1b00}
.b.red{background:linear-gradient(#f2606a,#c9303b);color:#fff}
.b.green{background:linear-gradient(#25a974,#14764f);color:#fff}
.b.ghost{background:transparent;border:1px solid var(--line)}
.b.sm{height:36px;font-size:14px;padding:0 10px;border-radius:10px}
.b.full{width:100%}

/* ---------- หน้าแรก / ล็อบบี้ ---------- */
.pad{padding:20px 18px;overflow:auto;flex:1}
.logo{text-align:center;margin:18px 0 22px}
.logo .suits{font-size:26px;letter-spacing:10px;color:var(--gold)}
.logo h1{margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;background:linear-gradient(#fff3c4,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:6px 0 0;color:var(--mute);font-size:14px}
.card-box{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card-box h3{margin:0 0 10px;font-size:16px;font-weight:600}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);padding:0 12px;font-size:17px;outline:none}
.in:focus{border-color:var(--gold)}
.in.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-size:24px;font-weight:600}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
details summary{cursor:pointer;color:var(--mute);font-size:14px;padding:8px 0;list-style:none}
details summary::before{content:'⚙️ '}
.sep{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}
.bigcode{font-size:56px;font-weight:700;letter-spacing:12px;text-align:center;color:var(--gold);padding-left:12px;line-height:1.1}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px}
.plist li:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;flex:none}
.dot.off{background:#777}
.plist .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:1px 6px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:8px 0}

/* ---------- เกม ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;font-size:13px;color:var(--mute)}
.top .code{background:rgba(255,255,255,.08);border-radius:10px;padding:5px 10px;font-weight:600;color:var(--gold);letter-spacing:3px;border:0;font-size:14px;cursor:pointer}
.top .mid{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:inline-flex;align-items:center;justify-content:center;width:38px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.08);font-size:18px;position:relative;cursor:pointer}
.ic .badge{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--red);display:none}
.ic.has .badge{display:block}
.conn{display:none;background:#8a5a00;color:#fff;text-align:center;font-size:13px;padding:3px}
.conn.on{display:block}

.tablewrap{flex:1;min-height:300px;position:relative;margin:0 4px}
.felt{position:absolute;inset:6% 2.5%;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,var(--felt1),var(--felt2) 75%);box-shadow:0 0 0 7px var(--rail),0 0 0 9px #70462a,0 10px 30px rgba(0,0,0,.5),inset 0 0 50px rgba(0,0,0,.5)}
.felt::after{content:'PokerPEPAE&Fri';position:absolute;left:0;right:0;top:63%;text-align:center;color:rgba(255,255,255,.07);font-weight:700;font-size:20px;letter-spacing:1px}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:78%;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.potline{background:rgba(0,0,0,.35);border-radius:20px;padding:2px 12px;font-size:14px;color:#dff5e8}
.potline b{color:var(--gold);font-weight:600}
.board{display:flex;gap:4px;--cw:min(11.2vw,50px)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border:1.5px dashed rgba(255,255,255,.18);border-radius:calc(var(--cw)*.14)}
.banner{min-height:20px;text-align:center;font-size:14px;line-height:1.25;color:#fff;max-width:100%}
.banner .w{color:var(--gold);font-weight:600}

.card{width:var(--cw);height:calc(var(--cw)*1.4);background:var(--card);border-radius:calc(var(--cw)*.14);color:#15171c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);font-size:calc(var(--cw)*.5);flex:none;transition:opacity .2s}
.card i{font-style:normal;font-size:calc(var(--cw)*.5);margin-top:1px}
.card.red{color:#d62839}
.card.back{background:repeating-linear-gradient(45deg,#1d4ed8 0 3px,#1e3fae 3px 6px);border:calc(var(--cw)*.08) solid #fff}
.card.dim{opacity:.35}
.card.hl{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(244,201,93,.8);transform:translateY(-3px)}
.card.deal{animation:flip .8s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes flip{0%{transform:perspective(500px) rotateY(100deg) translateY(-18px) scale(.8);opacity:0}45%{opacity:1}100%{transform:none;opacity:1}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes deal{from{transform:translateY(-14px) scale(.8);opacity:0}to{transform:none;opacity:1}}

.seat{position:absolute;transform:translate(-50%,-50%);width:76px;z-index:3;text-align:center}
.seat .mini{display:flex;justify-content:center;gap:2px;--cw:24px;height:22px;position:relative;z-index:0;margin-bottom:-8px}
.seat .mini.rev{--cw:30px;height:42px;margin-bottom:3px}
.seat .mini.rev .card{transform:none!important}
.seat .mini .card{box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seat .mini .card:first-child{transform:rotate(-7deg)}
.seat .mini .card:last-child{transform:rotate(7deg)}
.plate{position:relative;z-index:1;background:linear-gradient(#17352a,#0c241b);border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:3px 4px 4px;box-shadow:0 3px 8px rgba(0,0,0,.45);overflow:hidden}
.plate .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.plate .ch{font-size:13px;font-weight:600;color:var(--gold);line-height:1.2}
.plate .tm{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:2px;visibility:hidden}
.plate .tm i{display:block;height:100%;width:100%;background:var(--gold);border-radius:3px}
.seat.turn .plate{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,201,93,.45),0 0 16px rgba(244,201,93,.55)}
.seat.turn .plate .tm{visibility:visible}
.seat.turn.warn .plate .tm i{background:var(--red)}
.seat.me .plate{border-color:#5ad6a0}
.seat.folded .plate,.seat.folded .mini{opacity:.45}
.seat.win .plate{border-color:var(--gold);background:linear-gradient(#5b4310,#2c2007);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(244,201,93,.9)}
.seat .act{margin:3px auto 0;display:inline-block;max-width:92px;font-size:11px;line-height:1.2;background:rgba(0,0,0,.55);border-radius:9px;padding:1px 7px;color:#fff;white-space:nowrap}
.seat .act.off{color:#ffb4b4}
.dbtn{position:absolute;right:-4px;top:12px;z-index:4;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;background:#fff;color:#111;border-radius:12px;padding:4px 9px;font-size:13px;max-width:150px;width:max-content;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:deal .2s ease-out;line-height:1.25;word-break:break-word}
.bet{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;background:rgba(0,0,0,.45);border-radius:14px;padding:1px 8px 1px 3px;color:#fff}
.chip{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#d33 21% 55%,#fff 56% 62%,#d33 63%);border:1px solid #fff;flex:none}

.dense .seat{width:62px}
.dense .plate{border-radius:10px;padding:2px 3px 3px}
.dense .plate .nm{font-size:11px}
.dense .plate .ch{font-size:12px}
.dense .seat .mini{--cw:19px;height:17px}
.dense .seat .mini.rev{--cw:25px;height:35px}
.dense .seat .act{font-size:10px;max-width:68px;padding:0 5px}
.dense .board{--cw:min(9.4vw,42px);gap:3px}
.dense .bet{font-size:12px}
.dense .dbtn{width:17px;height:17px;font-size:10px;top:10px;right:-3px}

.panel{background:linear-gradient(#0d3123,#082018);border-top:1px solid var(--line);padding:6px 10px 8px;height:240px;flex:none;overflow:hidden;border-radius:18px 18px 0 0}
.mine{display:flex;align-items:center;gap:8px;--cw:38px;height:56px}
.mine .mi{margin-left:6px;min-width:0}
.mine .hn{font-weight:600;color:var(--gold);font-size:16px;line-height:1.2}
.mine .st{font-size:13px;color:var(--mute);line-height:1.3}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .b{height:44px}
.acts .b{flex:1;padding:0 6px}
.acts .b.call{flex:1.2}
.raisebar{margin-top:5px}
.raisebar .sl{display:flex;align-items:center;gap:8px;height:34px}
.raisebar input[type=range]{flex:1;accent-color:var(--gold);height:30px}
.raisebar .pre{display:flex;gap:6px;margin-top:5px}
.raisebar .r2{display:flex;gap:6px;margin-top:5px}
.raisebar .r2 .in{flex:0 0 50%;width:50%;height:34px;font-size:16px;text-align:center;font-weight:600;color:var(--gold);padding:0 6px}
.raisebar .r2 .b{flex:1;height:34px;font-size:13px;padding:0}
.raisebar .pre .b{flex:1;height:32px;font-size:13px;padding:0}
.stepbtn{width:38px;height:32px;border-radius:10px;border:0;background:#1b4a39;font-size:20px;font-weight:600;cursor:pointer}
.msg{margin-top:6px;text-align:center;font-size:15px;color:var(--ink)}
.msg .b{margin-top:6px}

/* ---------- ลิ้นชัก ---------- */
.drawer{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.55)}
.drawer.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:72dvh;background:#0c2a20;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;gap:6px;padding:10px 10px 0}
.tabs button{flex:1;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.06);font-weight:500;cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a1b00;font-weight:600}
.tabbody{flex:1;min-height:0;overflow:auto;padding:10px 14px}
.logl p{margin:0;padding:4px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.chatl .m{margin:6px 0;font-size:15px}
.chatl .m b{color:var(--gold);font-weight:500}
.emo{display:flex;gap:6px;padding:6px 10px;overflow:auto}
.emo button{border:0;background:rgba(255,255,255,.08);border-radius:12px;font-size:22px;padding:2px 10px;cursor:pointer;flex:none}
.chatin{display:flex;gap:8px;padding:6px 10px 10px}
.chatin .in{height:42px}

.sub{font-size:13px;color:var(--mute);margin:-4px 0 8px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;color:var(--ink)}
label.chk input{width:20px;height:20px;accent-color:var(--gold)}
.rm{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.rm .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rm .rh b{color:var(--gold);letter-spacing:3px;font-size:19px;font-weight:600}
.rm .rh span{font-size:12px;color:var(--mute);text-align:right}
.rm .rn{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.rm .rn i{font-style:normal;font-size:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:1px 8px 1px 6px;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.rm .rn i::before{content:'';width:6px;height:6px;border-radius:50%;background:#3ddc84;flex:none}
.rm .rn i.off{opacity:.5}
.rm .rn i.off::before{background:#777}
.rm .ra{display:flex;gap:8px}
.rm .ra .b{flex:1}
.ic.mic-on{background:#1d7a52}
.ic.mic-muted{background:#8a2b34}
.ic.mic-listen{background:#2b5a8a}
.seat.talking .plate{border-color:#3ddc84;box-shadow:0 0 0 2px rgba(61,220,132,.55),0 0 16px rgba(61,220,132,.85)}
.vb{position:absolute;left:-5px;top:12px;z-index:4;min-width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.72);font-size:11px;display:flex;align-items:center;justify-content:center}
.vbox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:12px 0}
.vbox h4{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--gold)}
.vbox .vr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:15px}
.vbox .vr .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbox small{color:var(--mute);font-size:12px}
.vbox small.ok{color:#3ddc84}
.vbox small.bad{color:#ff8a8a}
.vbox .tip{font-size:12px;color:var(--mute);margin:8px 0 0}
.sheettitle{display:none;padding:14px 16px 0;font-weight:600;font-size:18px}
.raisebar .amt{display:flex;align-items:center;gap:8px;margin-top:6px}
.raisebar .amt span{font-size:13px;color:var(--mute);white-space:nowrap}
.raisebar .amt .in{height:38px;font-size:17px;text-align:center;font-weight:600;color:var(--gold)}
.raisebar .pre .b.allin{background:linear-gradient(#ff9a4d,#e0481f);color:#fff;font-weight:700;box-shadow:0 0 10px rgba(255,120,50,.6)}
.bi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.bi h4{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--gold)}
.bi .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:15px}
.bi .r i{font-style:normal;color:var(--mute);font-size:12px}
.bi .r b{font-weight:600}
.fab{position:absolute;right:6px;bottom:4px;z-index:20;width:44px;height:42px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.ic{color:inherit}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#0c2a20;border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
.mbox h3{margin:0 0 6px;font-size:19px;color:var(--gold)}
.mbox label.chk{margin-top:14px}
.pos{position:absolute;right:-5px;z-index:4;min-width:21px;height:18px;padding:0 3px;border-radius:9px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);color:#fff}
.pos.sb{background:#2f7fd1;top:34px}
.pos.bb{background:#e0861f;top:34px}
.pos.sb+.pos.bb{top:54px}
.dense .pos{top:30px;height:16px;min-width:19px;font-size:9px}
.dense .pos.sb+.pos.bb{top:48px}
.coinbox{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.coinbox h4{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--gold)}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.lg .sw{width:12px;height:12px;border-radius:50%;flex:none}
.lg .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .sk{font-size:14px;letter-spacing:1px;white-space:nowrap}
.lg .sk i{font-style:normal;font-size:12px;color:var(--mute);letter-spacing:0;margin-left:2px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;border-radius:14px;padding:9px 16px;font-size:15px;z-index:99;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- หน้าแรก -->
  <section id="home" class="screen">
    <div class="pad">
      <div class="logo">
        <div class="suits">♠ ♥ ♦ ♣</div>
        <h1>PokerPEPAE&amp;Fri</h1>
        <p>Texas Hold'em เปเป้และผองเพื่อน</p>
      </div>
      <div class="card-box">
        <label class="f" for="name">ชื่อของคุณ</label>
        <input id="name" class="in" maxlength="14" placeholder="เช่น PEPAE" autocomplete="off">
      </div>
      <button id="btnCreate" class="b gold full" style="margin-bottom:14px">➕ สร้างห้อง</button>
      <div class="card-box">
        <h3>เข้าห้องของเพื่อน</h3>
        <div class="sub">ห้องที่ออนไลน์อยู่ตอนนี้</div>
        <div id="roomList"><p class="hint">กำลังโหลดรายการห้อง…</p></div>
        <div class="sep">หรือใส่รหัสห้อง</div>
        <input id="joinCode" class="in code" maxlength="4" placeholder="รหัสห้อง" autocomplete="off" autocapitalize="characters">
        <div class="row" style="margin-top:10px">
          <button id="btnJoin" class="b green">เข้าร่วมเล่น</button>
          <button id="btnWatch" class="b ghost">👁 ดูอย่างเดียว</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ล็อบบี้ -->
  <section id="lobby" class="screen">
    <div class="pad">

<!-- ลิ้นชัก แชท/ประวัติ/ห้อง -->
<div class="drawer" id="drawer">

<!-- หน้าต่างตั้งค่าห้อง (เปิดหลังกดสร้างห้อง) -->
<div class="drawer" id="createModal">
  <div class="mbox">
    <h3>ตั้งค่าห้อง</h3>
    <label class="f" for="sChips">ชิปเริ่มต้นต่อคน</label>
    <select id="sChips" class="in">
      <option>500</option><option selected>1000</option><option>2000</option><option>5000</option><option>10000</option>
    </select>

    <select id="sBlinds" class="in">
      <option value="5/10">5 / 10</option><option value="10/20" selected>10 / 20</option><option value="25/50">25 / 50</option><option value="50/100">50 / 100</option>

      <option value="0">ไม่จำกัด</option><option value="15">15 วินาที</option><option value="30" selected>30 วินาที</option><option value="60">60 วินาที</option>

      <button id="btnCreateOk" class="b gold">สร้างห้อง</button>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('en-US');
const SUIT = ['♠', '♥', '♦', '♣'];
const RK = '23456789TJQKA';
const EMOJI = ['👍', '😂', '😎', '😭', '🔥', '🤝', '😱', '🍀', '💸', '🙏'];

let session = null;      // {code, token}
let state = null;        // ข้อมูลล่าสุดจากเซิร์ฟเวอร์
let es = null;
let clockOffset = 0;     // เวลาเซิร์ฟเวอร์ - เวลาเครื่อง
let turnTotal = 1;
let raiseTo = 0, raiseKey = '';
let panelSig = '';
let lastBoardLen = 0, lastHandNo = -1, lastBoardKey = '';
let fxKey = '';          // กันพลุซ้ำในตาเดียวกัน
let lastChatId = null;
let bubbles = {};        // playerId -> {text, until}
let unread = false;
let drawerTab = 'chat';
let lastToAct = null;

// ---------- ตัวช่วย ----------
function ls(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* ใช้ไม่ได้ก็ข้าม */ }
  return null;
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
async function api(path, body) {
  let r;
  try {
    r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  } catch (e) { toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); throw e; }
  let d = {};
  try { d = await r.json(); } catch (e) { /* ว่าง */ }
  if (!r.ok) { toast(d.error || 'เกิดข้อผิดพลาด'); throw new Error(d.error || 'error'); }
  return d;
}
const act = (type, amount) => api('action', { ...session, type, amount }).catch(() => {});

function cardEl(c, cls = '', style = '') {
  if (c == null) return `<div class="card back ${cls}" style="${style}"></div>`;
  const r = RK[c % 13], s = Math.floor(c / 13);
  return `<div class="card ${s === 1 || s === 2 ? 'red' : ''} ${cls}" style="${style}"><b>${r === 'T' ? '10' : r}</b><i>${SUIT[s]}</i></div>`;
}
function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);
  if (id === 'home') { lastRoomsTxt = null; loadRooms(); }
}
const nameOf = (id) => { const p = state && state.players.find((q) => q.id === id); return p ? p.name : '?'; };

// ---------- หน้าแรก ----------
$('#name').value = ls('pp_name') || '';
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('#joinCode').value = urlRoom.toUpperCase().slice(0, 4);

function getName() {
  const n = $('#name').value.trim();
  if (!n) { toast('ใส่ชื่อก่อนนะ'); $('#name').focus(); return null; }
  ls('pp_name', n);
  return n;
}
$('#btnCreate').onclick = () => { if (getName()) $('#createModal').classList.add('on'); };
$('#btnCreateCancel').onclick = () => $('#createModal').classList.remove('on');
$('#createModal').onclick = (e) => { if (e.target.id === 'createModal') $('#createModal').classList.remove('on'); };
$('#btnCreateOk').onclick = async () => {
  const name = getName(); if (!name) return;
  $('#createModal').classList.remove('on');
  const [sb, bb] = $('#sBlinds').value.split('/').map(Number);
  try {
    const d = await api('create', { name, settings: { startChips: Number($('#sChips').value), sb, bb, turnTime: Number($('#sTime').value), private: $('#sPrivate').checked } });
    startSession(d);
  } catch (e) { /* แจ้งไปแล้ว */ }
};
async function doJoin(code) {
  const name = getName(); if (!name) return;
  const saved = JSON.parse(ls('pp_session') || 'null');
  try {
    const d = await api('join', { code, name, token: saved && saved.code === code ? saved.token : undefined });
    startSession(d);
  } catch (e) { /* แจ้งไปแล้ว */ }
}
async function doWatch(code) {
  const name = $('#name').value.trim() || 'ผู้ชม'; // ผู้ชมไม่ต้องใส่ชื่อก็ได้
  try { startSession(await api('watch', { code, name })); } catch (e) { /* แจ้งไปแล้ว */ }
}
function typedCode() {
  const code = $('#joinCode').value.trim().toUpperCase();
  if (code.length !== 4) { toast('รหัสห้องมี 4 ตัวอักษร'); return null; }
  return code;
}
$('#btnJoin').onclick = () => { const c = typedCode(); if (c) doJoin(c); };
$('#btnWatch').onclick = () => { const c = typedCode(); if (c) doWatch(c); };

// ---------- รายการห้องออนไลน์ ----------
let lastRoomsTxt = null;
const PHASE = (r) => (r.phase === 'lobby' ? 'รอเริ่มเกม' : r.phase === 'waiting' ? 'รอผู้เล่นบายอิน' : `กำลังเล่น ตาที่ ${r.handNo}`);
function renderRooms(list) {
  const el = $('#roomList');
  if (!list.length) { el.innerHTML = '<p class="hint">ยังไม่มีห้องที่ออนไลน์ตอนนี้ — สร้างห้องใหม่ได้เลย</p>'; return; }
  el.innerHTML = list.map((r) => `<div class="rm" data-code="${esc(r.code)}">
    <div class="rh"><b>${esc(r.code)}</b><span>${r.count}/9 คน · ${PHASE(r)}<br>บลายด์ ${r.settings.sb}/${r.settings.bb}${r.spectators ? ` · 👁 ${r.spectators}` : ''}</span></div>
    <div class="rn">${r.players.map((p) => `<i class="${p.online ? '' : 'off'}">${esc(p.name)}</i>`).join('')}</div>
    <div class="ra"><button class="b sm green" data-join ${r.full ? 'disabled' : ''}>${r.full ? 'ห้องเต็ม' : 'เข้าเล่น'}</button><button class="b sm ghost" data-watch>👁 ดู</button></div></div>`).join('');
}
async function loadRooms() {
  if (session || document.hidden || !$('#home').classList.contains('on')) return;
  try {
    const r = await fetch('/api/rooms', { cache: 'no-store' });
    if (!r.ok) return;
    const txt = await r.text();
    if (txt === lastRoomsTxt) return;
    lastRoomsTxt = txt;
    renderRooms(JSON.parse(txt));
  } catch (e) { /* ออฟไลน์ ลองใหม่รอบหน้า */ }
}
setInterval(loadRooms, 4000);
$('#roomList').onclick = (e) => {
  const rm = e.target.closest('.rm'); if (!rm) return;
  if (e.target.closest('[data-join]')) doJoin(rm.dataset.code);
  else if (e.target.closest('[data-watch]')) doWatch(rm.dataset.code);
};
$('#joinCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#btnJoin').click(); });

function startSession(d) {
  leaveVoice(true);
  session = { code: d.code, token: d.token };
  ls('pp_session', JSON.stringify(session));
  history.replaceState(null, '', location.pathname);
  state = null; lastChatId = null; bubbles = {}; lastHandNo = -1; lastBoardKey = ''; lastBoardLen = 0; fxKey = '';
  connect();
}
function dropSession(msg) {
  leaveVoice(true);
  if (es) es.close(); es = null;
  session = null; state = null;
  ls('pp_session', null);
  show('home');
  if (msg) toast(msg);
}

// ---------- เชื่อมต่อเรียลไทม์ ----------
function connect() {
  if (es) es.close();
  if (!session) return;
  const q = `code=${encodeURIComponent(session.code)}&token=${encodeURIComponent(session.token)}`;
  es = new EventSource('/api/events?' + q);
  es.addEventListener('state', (e) => { setConn(true); onState(JSON.parse(e.data)); });
  es.addEventListener('signal', (e) => { try { onSignal(JSON.parse(e.data)); } catch (err) { /* ข้อมูลเสียหาย ข้ามไป */ } });
  es.onopen = () => setConn(true);
  es.onerror = async () => {
    setConn(false);
    try {
      const r = await fetch('/api/session?' + q);
      if (r.status === 404 || r.status === 403) dropSession('ห้องนี้ไม่อยู่แล้ว (อาจเซิร์ฟเวอร์เพิ่งรีสตาร์ท)');
    } catch (e2) { /* ออฟไลน์ ปล่อยให้ลองใหม่เอง */ }
  };
}
function setConn(ok) { $('#conn').classList.toggle('on', !ok && !!session); }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    document.title = 'PokerPEPAE&Fri';
    if (session && (!es || es.readyState !== 1)) connect();
  }
});

function onState(s) {
  clockOffset = s.serverNow - Date.now();
  const prev = state;
  state = s;
  if (!s.you) { dropSession('คุณออกจากห้องแล้ว'); return; }
  const spectating = !!s.you.spectator;
  const me = spectating ? null : s.players.find((p) => p.id === s.you.id);
  if (!spectating && (!me || me.left)) { dropSession('คุณออกจากห้องแล้ว'); return; }

  // แชทใหม่ → บับเบิล
  const maxId = s.chat.length ? s.chat[s.chat.length - 1].id : 0;
  if (lastChatId === null) lastChatId = maxId;
  for (const m of s.chat) {
    if (m.id > lastChatId) {
      bubbles[m.from] = { text: m.text, until: Date.now() + 4500 };
      setTimeout(render, 4600);
      if (!$('#drawer').classList.contains('on') || drawerTab !== 'chat') unread = true;
    }
  }
  lastChatId = maxId;

  // ถึงตาเรา
  if (me && s.toAct === me.id && lastToAct !== me.id) {
    if (navigator.vibrate) navigator.vibrate(180);
    if (document.hidden) document.title = '🔔 ถึงตาคุณ! PokerPEPAE&Fri';
  }
  lastToAct = s.toAct;

  if (s.turnDeadline) turnTotal = Math.max(1, s.turnDeadline - s.serverNow);
  render();
  syncVoice();
  renderMic();

  // พลุฉลองที่ที่นั่งผู้ชนะ (ครั้งเดียวต่อตา)
  if (s.phase === 'showdown' && s.result) {
    const key = s.code + ':' + s.handNo;
    if (fxKey !== key) { fxKey = key; celebrate(s.result.winners.map((w) => w.id)); }
  }
}

// ---------- พลุ ----------
const fx = { parts: [], raf: 0, ctx: null, w: 0, h: 0 };
const FX_COLORS = ['#ffd54a', '#ff5d73', '#5ad6a0', '#59b7ff', '#ff9a4d', '#ffffff', '#c77dff'];
function burst(cx, cy, n) {
  const main = FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.4 + Math.random() * 4.4;
    fx.parts.push({
      x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.3,
      life: 1, decay: 0.011 + Math.random() * 0.012, r: 1.5 + Math.random() * 1.9,
      color: Math.random() < 0.7 ? main : FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)],
    });
  }
}
function fxLoop() {
  const ctx = fx.ctx;
  ctx.clearRect(0, 0, fx.w, fx.h);
  fx.parts = fx.parts.filter((p) => p.life > 0);
  for (const p of fx.parts) {
    p.vy += 0.06; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  fx.raf = fx.parts.length ? requestAnimationFrame(fxLoop) : 0;
}
function celebrate(winnerIds) {
  try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) { /* ใช้ไม่ได้ก็ข้าม */ }
  const wrap = $('#tablewrap'), canvas = $('#fx');
  const r = wrap.getBoundingClientRect();
  if (!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  fx.ctx = canvas.getContext('2d'); fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.w = r.width; fx.h = r.height;
  for (const id of winnerIds) {
    const seat = document.querySelector(`.seat[data-pid="${id}"] .plate`);
    if (!seat) continue;
    const pr = seat.getBoundingClientRect();
    const cx = pr.left + pr.width / 2 - r.left, cy = pr.top + pr.height / 2 - r.top;
    [0, 420, 900, 1450, 2050, 2700].forEach((t) => setTimeout(() => {
      burst(cx + (Math.random() - 0.5) * pr.width * 0.7, cy + (Math.random() - 0.5) * pr.height * 0.6 - 8, 36 + Math.floor(Math.random() * 24));
      if (!fx.raf) fx.raf = requestAnimationFrame(fxLoop);
    }, t));
  }
}

// ---------- วาดหน้าจอ ----------
function render() {
  if (!state) return;
  if (state.phase === 'lobby') { renderLobby(); show('lobby'); } else { renderGame(); show('game'); }
  if ($('#drawer').classList.contains('on')) renderDrawer();
}

function inviteLink() { return location.origin + '/?room=' + state.code; }
async function share() {
  const url = inviteLink();
  const text = `มาเล่นโป๊กเกอร์กัน! รหัสห้อง ${state.code}`;
  if (navigator.share) { try { await navigator.share({ title: 'PokerPEPAE&Fri', text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('คัดลอกลิงก์แล้ว'); }
  catch (e) { prompt('คัดลอกลิงก์นี้', url); }
}
$('#btnShare').onclick = share;
$('#gCode').onclick = share;

function renderLobby() {
  const s = state, me = s.players.find((p) => p.id === s.you.id) || {};
  const spec = !!s.you.spectator;
  $('#lbSpec').textContent = s.spectators.length ? '👁 ผู้ชม: ' + s.spectators.join(', ') : '';
  $('#btnLobbyJoin').style.display = spec ? '' : 'none';
  $('#btnLobbyJoin').disabled = s.players.length >= 9;
  $('#lbCode').textContent = s.code;
  $('#lbCount').textContent = s.players.length;
  $('#lbPlayers').innerHTML = s.players.map((p) =>
    `<li><span class="dot ${p.connected ? '' : 'off'}"></span><span class="grow">${esc(p.name)}${p.id === s.you.id ? ' (คุณ)' : ''}</span>${p.isHost ? '<span class="tag">เจ้าของห้อง</span>' : ''}${me.isHost && p.id !== me.id ? `<button class="b sm ghost" data-kick="${p.id}">เชิญออก</button>` : ''}</li>`).join('');
  $('#lbInfo').textContent = `ชิปเริ่มต้น ${fmt(s.settings.startChips)} · บลายด์ ${s.settings.sb}/${s.settings.bb} · ` + (s.settings.turnTime ? `${s.settings.turnTime} วินาที/ตา` : 'ไม่จำกัดเวลา');
  $('#btnStart').style.display = me.isHost ? '' : 'none';
  $('#btnStart').disabled = s.players.length < 2;
  $('#lbWait').textContent = spec ? '👁 คุณกำลังดูอยู่ (ดูได้อย่างเดียว)' : me.isHost ? (s.players.length < 2 ? 'รอเพื่อนเข้าห้องอย่างน้อย 1 คน' : '') : 'รอเจ้าของห้องกดเริ่มเกม…';
}
$('#lbPlayers').onclick = (e) => {
  const id = e.target.dataset && e.target.dataset.kick;
  if (id && confirm('เชิญคนนี้ออกจากห้อง?')) api('kick', { ...session, target: id }).catch(() => {});
};
$('#btnStart').onclick = () => api('start', session).catch(() => {});
$('#btnLeaveLobby').onclick = leaveRoom;
async function leaveRoom() {
  if (!confirm('ออกจากห้องนี้?')) return;
  try { await api('leave', session); } catch (e) { /* ไม่เป็นไร */ }
  closeDrawer();
  dropSession();
}

function renderGame() {
  const s = state;
  const me = s.players.find((p) => p.id === s.you.id);
  const n = s.players.length;
  const meIdx = Math.max(0, s.players.indexOf(me)); // ผู้ชม: ให้ผู้เล่นคนแรกอยู่ล่างสุด
  const res = s.result;
  const winIds = new Set(res ? res.winners.map((w) => w.id) : []);
  const hlCards = new Set();
  if (res && res.showdown) for (const w of res.winners) (res.hands[w.id] ? res.hands[w.id].best : []).forEach((c) => hlCards.add(c));
  const showHL = hlCards.size > 0;

  $('#gCode').textContent = s.code;
  $('#gMid').textContent = `ตาที่ ${s.handNo} · ${s.settings.sb}/${s.settings.bb}` + (s.spectators.length ? ` · 👁 ${s.spectators.length}` : '');
  $('#gPot').textContent = fmt(s.pot);
  $('#btnMenu').classList.toggle('has', unread);

  // ไพ่กลาง — สร้างใหม่เฉพาะเมื่อไพ่เปลี่ยน (กันแอนิเมชันพลิกไพ่ถูกตัดกลางคัน) และเปิดทีละใบเว้นจังหวะให้ลุ้น
  const boardKey = s.handNo + ':' + s.community.join(',') + ':' + [...hlCards].join(',');
  if (boardKey !== lastBoardKey) {
    const newHand = s.handNo !== lastHandNo;
    let boardHTML = '';
    for (let i = 0; i < 5; i++) {
      if (i < s.community.length) {
        const c = s.community[i];
        const isNew = !newHand && i >= lastBoardLen;
        const delay = isNew ? `animation-delay:${((i - lastBoardLen) * 0.65 + 0.1).toFixed(2)}s` : '';
        const cls = (isNew ? 'deal ' : '') + (showHL ? (hlCards.has(c) ? 'hl' : 'dim') : '');
        boardHTML += cardEl(c, cls, delay);
      } else boardHTML += '<div class="slot"></div>';
    }
    $('#gBoard').innerHTML = boardHTML;
    lastBoardKey = boardKey;
    lastBoardLen = s.community.length; lastHandNo = s.handNo;
  }

  // ข้อความผลตา
  let banner = '';
  if (s.phase === 'showdown' && res) {
    banner = res.winners.map((w) => `<div><span class="w">🏆 ${esc(nameOf(w.id))}</span> +${fmt(w.won)}${w.handName ? ' · ' + esc(w.handName) : ''}</div>`).join('');
    if (res.pots.length > 1) banner += `<div style="opacity:.75;font-size:12px">มีไซด์พ็อต ${res.pots.length - 1} ก้อน</div>`;
  } else if (s.phase === 'waiting') {
    banner = s.soleId ? `<div><span class="w">🏆 ${esc(nameOf(s.soleId))}</span> ครองชิปทั้งโต๊ะ</div><div style="opacity:.8;font-size:13px">รอผู้เล่นบายอิน</div>` : '<div style="opacity:.8">รอผู้เล่นบายอิน</div>';
  } else if (s.phase === 'hand') {
    banner = s.runout ? 'ลุ้นไพ่… 🤞' : { preflop: 'พรีฟลอป', flop: 'ฟลอป', turn: 'เทิร์น', river: 'ริเวอร์' }[s.street];
    banner = `<span style="opacity:.75">${banner}</span>`;
  }
  $('#gBanner').innerHTML = banner;

  // ที่นั่ง
  const dense = n >= 7;
  $('#tablewrap').classList.toggle('dense', dense);
  const rx = dense ? 43 : 41, ry = dense ? 39 : 37;
  let seats = '';
  s.players.forEach((p, i) => {
    const rel = (i - meIdx + n) % n;
    const th = ((90 + (rel * 360) / n) * Math.PI) / 180;
    const x = 50 + rx * Math.cos(th), y = 50 + ry * Math.sin(th);
    const isMe = !!me && p.id === me.id;
    const showCards = !isMe && p.hole.length > 0;
    const cls = ['seat', isMe ? 'me' : '', s.toAct === p.id && s.phase === 'hand' ? 'turn' : '', p.folded ? 'folded' : '', winIds.has(p.id) ? 'win' : '', voice.speaking.has(p.id) ? 'talking' : ''].join(' ');
    const vm = (s.voice || []).find((m) => m.id === p.id);
    const vb = vm ? `<span class="vb">${vm.mode === 'listen' ? '🎧' : vm.muted ? '🔇' : '🎤'}</span>` : '';
    const mini = showCards ? p.hole.map((c) => cardEl(c, c != null && showHL ? (hlCards.has(c) ? 'hl' : 'dim') : '')).join('') : '';
    let label = p.lastAction;
    if (!label && s.phase !== 'lobby') {
      if (p.chips === 0 && !p.inHand) label = 'หมดชิป';
      else if (!p.inHand) label = 'รอตาหน้า';
    }
    if (res && res.showdown && res.hands[p.id] && !p.folded) label = res.hands[p.id].name;
    const off = !p.connected ? '<div class="act off">ออฟไลน์</div>' : (label ? `<div class="act">${esc(label)}</div>` : '');
    const b = bubbles[p.id] && bubbles[p.id].until > Date.now() ? `<div class="bubble">${esc(bubbles[p.id].text)}</div>` : '';
    seats += `<div class="${cls}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" data-pid="${p.id}">
      ${b}<div class="mini${showCards && p.hole[0] != null ? ' rev' : ''}">${mini}</div>
      <div class="plate"><div class="nm">${esc(p.name)}</div><div class="ch">${fmt(p.chips)}</div><div class="tm"><i></i></div></div>
      ${p.isDealer ? '<span class="dbtn">D</span>' : ''}${p.isSB ? '<span class="pos sb">SB</span>' : ''}${p.isBB ? '<span class="pos bb">BB</span>' : ''}${vb}${off}</div>`;
    if (p.bet > 0) {
      const k = dense ? 0.52 : 0.4;
      const bx = x + (50 - x) * k, by = y + (46 - y) * k;
      seats += `<div class="bet" style="left:${bx.toFixed(1)}%;top:${by.toFixed(1)}%"><span class="chip"></span>${fmt(p.bet)}</div>`;
    }
  });
  $('#gSeats').innerHTML = seats;

  renderPanel(me, hlCards);
}

function status(me) {
  const s = state;
  if (s.phase === 'showdown') return `ตาถัดไปใน <b id="cd">–</b> วินาที`;
  if (s.phase === 'waiting') {
    if (s.nextHandAt) return 'มีคนบายอินแล้ว ตาใหม่เริ่มใน <b id="cd">–</b> วินาที';
    return me.chips === 0 ? 'คุณหมดชิป — กดซื้อชิปเพื่อเล่นต่อ' : 'รอเพื่อนบายอิน…';
  }
  if (s.runout) return 'ไม่มีใครเดิมพันต่อแล้ว ลุ้นไพ่กันเลย! 🤞';
  if (s.options) return s.options.toCall > 0 ? `ถึงตาคุณ · ต้องจ่ายเพิ่ม ${fmt(s.options.toCall)}` : 'ถึงตาคุณ · เช็คหรือเดิมพันได้';
  if (me.folded) return 'คุณโฟลด์แล้ว';
  if (!me.inHand) return me.chips === 0 ? 'คุณหมดชิปแล้ว' : 'รอเริ่มตาหน้า';
  if (me.allIn) return 'ออลอิน! ลุ้นเลย 🤞';
  return `รอ ${esc(nameOf(s.toAct))} ตัดสินใจ…`;
}

function potRaise(frac) {
  const s = state, o = s.options;
  const me = s.players.find((p) => p.id === s.you.id);
  const to = Math.round(s.currentBet + frac * (s.pot + o.toCall));
  return Math.max(o.minRaiseTo, Math.min(o.maxRaiseTo, to));
}

function renderPanel(me, hlCards) {
  if (!me) { renderSpecPanel(); return; }
  const s = state, o = s.options;
  const sig = JSON.stringify([s.phase, s.handNo, s.street, s.toAct, s.currentBet, me.chips, me.bet, me.folded, me.inHand, me.isHost, s.you.handName, s.soleId, s.runout, !!s.nextHandAt, s.result && s.result.winners.length, !!o, o && o.minRaiseTo, o && o.maxRaiseTo, s.players.length]);
  if (sig === panelSig) return;
  panelSig = sig;
  // ทุกครั้งที่ถึงตาใหม่ ค่าเรสกลับเป็นต่ำสุดเสมอ
  const rkey = o ? [s.handNo, s.street, s.currentBet, me.bet].join('|') : '';
  if (o && (rkey !== raiseKey || raiseTo < o.minRaiseTo || raiseTo > o.maxRaiseTo)) raiseTo = o.minRaiseTo;
  raiseKey = rkey;

  const hole = me.hole || [];
  let h = `<div class="mine">${hole.length ? hole.map((c) => cardEl(c, hlCards.size ? (hlCards.has(c) ? 'hl' : 'dim') : '')).join('') : ''}
    <div class="mi"><div class="hn">${esc(s.you.handName || (hole.length && s.phase !== 'showdown' ? '' : ''))}</div><div class="st">${status(me)}</div></div></div>`;

  if (o) {
    const callAll = !o.canCheck && o.toCall >= me.chips;
    h += `<div class="acts">
      <button class="b red" id="aFold">โฟลด์</button>
      <button class="b green call" id="aCall">${o.canCheck ? 'เช็ค' : callAll ? 'ออลอิน ' + fmt(me.chips) : 'คอล ' + fmt(o.toCall)}</button>
      ${o.canRaise ? `<button class="b gold" id="aRaise"></button>` : ''}
    </div>`;
    if (o.canRaise && o.minRaiseTo < o.maxRaiseTo) {
      const sb = s.settings.sb, bb = s.settings.bb;
      const nSteps = Math.ceil((o.maxRaiseTo - o.minRaiseTo) / sb);
      h += `<div class="raisebar"><div class="sl">
        <button class="stepbtn" id="rMinus">−</button>
        <input type="range" id="rSlider" min="0" max="${nSteps}" step="1" value="0">
        <button class="stepbtn" id="rPlus">+</button></div>
        <div class="r2"><input id="rNum" class="in" type="number" inputmode="numeric" pattern="[0-9]*" aria-label="ระบุจำนวนเอง" min="${o.minRaiseTo}" max="${o.maxRaiseTo}" value="${raiseTo}">
          <button class="b sm" data-add="${sb}">+${fmt(sb)}</button><button class="b sm" data-add="${bb}">+${fmt(bb)}</button></div>
        <div class="pre"><button class="b sm" data-add="${bb * 2}">+${fmt(bb * 2)}</button><button class="b sm" data-add="${bb * 3}">+${fmt(bb * 3)}</button><button class="b sm" data-f="clear">ล้าง</button><button class="b sm allin" data-f="max">ออลอิน</button></div></div>`;
    }
  } else if (s.phase === 'waiting') {
    const w = s.soleId ? nameOf(s.soleId) : '';
    h += `<div class="msg">🏆 ${esc(w)} ครองชิปทั้งโต๊ะ<br><span style="color:var(--mute);font-size:13px">${s.nextHandAt ? 'มีคนบายอินแล้ว กำลังเริ่มตาใหม่…' : 'รอผู้เล่นบายอิน แล้วเล่นต่อได้เลย'}</span></div>`;
  }
  if (me.chips === 0 && !(s.phase === 'hand' && me.inHand)) {
    h += `<div class="msg"><button class="b gold" id="aRebuy">ซื้อชิปเพิ่ม ${fmt(s.settings.startChips)}</button></div>`;
  }
  const panel = $('#panel');
  panel.innerHTML = h;

  const $p = (q) => panel.querySelector(q);
  if (o) {
    $p('#aFold').onclick = () => act('fold');
    $p('#aCall').onclick = () => act(o.canCheck ? 'check' : 'call');
    const rb = $p('#aRaise');
    const upd = () => {
      if (!rb) return;
      const isAll = raiseTo >= o.maxRaiseTo;
      rb.innerHTML = isAll ? `ออลอิน ${fmt(o.maxRaiseTo)}` : `${o.isBet ? 'เดิมพัน' : 'เรสเป็น'} ${fmt(raiseTo)}`;
      const sl = $p('#rSlider'); if (sl) sl.value = Math.round((raiseTo - o.minRaiseTo) / s.settings.sb);
      const nm = $p('#rNum'); if (nm && document.activeElement !== nm) nm.value = raiseTo;
    };
    upd();
    if (rb) rb.onclick = () => act(raiseTo >= o.maxRaiseTo ? 'allin' : 'raise', raiseTo);
    const sl = $p('#rSlider');
    if (sl) {
      const sb = s.settings.sb;
      sl.oninput = () => { raiseTo = Math.min(o.maxRaiseTo, o.minRaiseTo + Number(sl.value) * sb); upd(); };
      const nm = $p('#rNum');
      nm.oninput = () => {
        const v = Math.floor(Number(nm.value));
        if (nm.value === '' || !Number.isFinite(v)) return;
        raiseTo = Math.max(o.minRaiseTo, Math.min(o.maxRaiseTo, v)); // ปรับเข้าช่วงที่เรสได้
        upd(true);
      };
      nm.onblur = () => { nm.value = raiseTo; };
      nm.onkeydown = (e) => { if (e.key === 'Enter') nm.blur(); };
      $p('#rMinus').onclick = () => { raiseTo = Math.max(o.minRaiseTo, raiseTo - sb); upd(); };
      $p('#rPlus').onclick = () => { raiseTo = Math.min(o.maxRaiseTo, raiseTo + sb); upd(); };
      panel.querySelectorAll('[data-add]').forEach((b) => {
        b.onclick = () => { raiseTo = Math.min(o.maxRaiseTo, raiseTo + Number(b.dataset.add)); upd(); };
      });
      panel.querySelectorAll('[data-f]').forEach((b) => {
        b.onclick = () => { raiseTo = b.dataset.f === 'max' ? o.maxRaiseTo : o.minRaiseTo; upd(); };
      });
    }
  }
  const rbuy = $p('#aRebuy'); if (rbuy) rbuy.onclick = () => api('rebuy', session).catch(() => {});
}

const LINE_COLORS = ['#f4c95d', '#4fc3f7', '#ef6b73', '#7be495', '#c792ea', '#ff9f43', '#5eead4', '#f78fb3', '#b8c0ff'];
function chartColors(s) {
  const m = {};
  (s.chart ? s.chart.ids : []).forEach((id, i) => { m[id] = LINE_COLORS[i % LINE_COLORS.length]; });
  return m;
}
function chartSVG(s, colors) {
  const c = s.chart;
  if (!c || c.pts.length < 2) return '<p class="hint" style="margin:6px 0">กราฟจะขึ้นหลังจบตาแรก</p>';
  const W = 340, H = 210, L = 44, R = 10, T = 10, B = 24;
  const pts = c.pts;
  const xs = pts.map((p) => p[0]);
  const x0 = xs[0], x1 = xs[xs.length - 1] || x0 + 1;
  let ymax = 0;
  pts.forEach((p) => p.slice(1).forEach((v) => { if (v != null && v > ymax) ymax = v; }));
  ymax = Math.max(ymax, 1);
  const step = Math.pow(10, Math.floor(Math.log10(ymax)));
  const top = Math.ceil(ymax / step) * step;
  const X = (h) => L + ((h - x0) / Math.max(1, x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - v / top) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = (top * i) / 4, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)"/><text x="${L - 5}" y="${y + 4}" text-anchor="end" fill="#8db5a2" font-size="10">${fmt(Math.round(v))}</text>`;
  }
  const every = Math.max(1, Math.ceil((x1 - x0) / 6));
  for (let h = x0; h <= x1; h += every) g += `<text x="${X(h)}" y="${H - 7}" text-anchor="middle" fill="#8db5a2" font-size="10">${h}</text>`;
  g += `<text x="${W - R}" y="${H - 7}" text-anchor="end" fill="#8db5a2" font-size="9"></text>`;
  c.ids.forEach((id, i) => {
    let d = '', last = null;
    pts.forEach((p) => {
      const v = p[i + 1];
      if (v == null) { last = null; return; }
      d += (last == null ? 'M' : 'L') + X(p[0]).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      last = v;
    });
    if (d) g += `<path d="${d}" fill="none" stroke="${colors[id]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg><div class="sub" style="text-align:center;margin:2px 0 0">แกนนอน = ตาที่ · แกนตั้ง = จำนวนชิป</div>`;
}

    const buyIn = s.settings.startChips;
    const colors = chartColors(s);
    const rows = s.players.map((p) => `<div class="r"><span>${esc(p.name)}</span><span><b>${fmt(buyIn * (1 + p.rebuys))}</b>${p.rebuys ? ` <i>(ซื้อเพิ่ม ${p.rebuys} ครั้ง)</i>` : ''}</span></div>`).join('');
    const lg = s.players.map((p) => {
      const k = p.kills || 0;
      return `<div class="lg"><span class="sw" style="background:${colors[p.id] || '#999'}"></span><span class="grow">${esc(p.name)} · ${fmt(p.chips)}</span><span class="sk">${k ? '💀'.repeat(Math.min(k, 5)) + `<i>×${k}</i>` : '<i>–</i>'}</span></div>`;
    }).join('');
    body.innerHTML = `<div class="bi"><h4>ยอดบายอินรวม</h4>${rows}</div>
      <div class="coinbox"><h4>📈 กราฟชิป</h4>${chartSVG(s, colors)}</div>
      <div class="coinbox"><h4>💀 สถิติกำจัดผู้เล่น</h4>${lg}</div>`;
  } else {
    body.innerHTML = `<button class="b ghost full" id="dShare">🔗 ส่งลิงก์เชิญเพื่อน (รหัส ${esc(s.code)})</button>
      <ul class="plist" style="margin-top:10px">${s.players.map((p) => `<li><span class="dot ${p.connected ? '' : 'off'}"></span><span class="grow">${esc(p.name)} · ${fmt(p.chips)}</span>${p.isHost ? '<span class="tag">เจ้าของห้อง</span>' : ''}${me.isHost && p.id !== me.id ? `<button class="b sm ghost" data-kick="${p.id}">เชิญออก</button>` : ''}</li>`).join('')}</ul>
      ${s.spectators.length ? `<p class="hint">👁 ผู้ชม (${s.spectators.length}): ${esc(s.spectators.join(', '))}</p>` : ''}
      ${voiceBoxHTML(s)}
      <button class="b red full" id="dLeave" style="margin-top:14px">ออกจากห้อง</button>`;
    bindVoiceBox(body);
    $('#dShare').onclick = share;
    $('#dLeave').onclick = leaveRoom;
    body.querySelectorAll('[data-kick]').forEach((b) => { b.onclick = () => { if (confirm('เชิญคนนี้ออกจากห้อง?')) api('kick', { ...session, target: b.dataset.kick }).catch(() => {}); }; });
  }
  if (drawerTab === 'chat') body.scrollTop = body.scrollHeight;
}

// ---------- ห้องเสียง (WebRTC เชื่อมตรงระหว่างเครื่อง เซิร์ฟเวอร์ส่งต่อแค่สัญญาณจับคู่) ----------
const voice = {
  mode: 'off',            // off | talk | listen
  muted: false,
  stream: null, ctx: null,
  peers: new Map(),       // id -> peer
  speaking: new Set(),
  analysers: new Map(),   // id -> {an, buf, until}
  localMute: new Set(),   // คนที่เราปิดเสียงเองฝั่งเรา
  orphans: new Map(),     // id -> [ice ที่มาก่อน offer]
  fails: new Map(),
  ice: null, busy: false, chain: Promise.resolve(), needTap: false,
};
const myId = () => (state && state.you ? state.you.id : null);
const isSpecNow = () => !!(state && state.you && state.you.spectator);
const vmember = (id) => ((state && state.voice) || []).find((m) => m.id === id);

async function getIce() {
  if (voice.ice) return voice.ice;
  try { voice.ice = (await (await fetch('/api/ice')).json()).iceServers; } catch (e) { /* ใช้ STUN สำรอง */ }
  if (!voice.ice) voice.ice = [{ urls: 'stun:stun.l.google.com:19302' }];
  return voice.ice;
}

function ensureCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!voice.ctx) { try { voice.ctx = new AC(); } catch (e) { return null; } }
  if (voice.ctx.state === 'suspended') voice.ctx.resume().catch(() => {});
  return voice.ctx;
}

function watchStream(id, stream) {
  const ctx = ensureCtx();
  if (!ctx) return;
  unwatch(id);
  try {
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    voice.analysers.set(id, { src, an, buf: new Uint8Array(an.fftSize), until: 0 });
  } catch (e) { /* ตรวจเสียงพูดไม่ได้ก็ยังคุยได้ */ }
}
function unwatch(id) {
  const a = voice.analysers.get(id);
  if (a) { try { a.src.disconnect(); } catch (e) { /* noop */ } voice.analysers.delete(id); }
  if (voice.speaking.delete(id)) paintTalking();
}
function paintTalking() {
  document.querySelectorAll('.seat[data-pid]').forEach((el) => el.classList.toggle('talking', voice.speaking.has(el.dataset.pid)));
}
setInterval(() => {
  if (!voice.analysers.size) return;
  const now = Date.now(); let changed = false;
  for (const [id, a] of voice.analysers) {
    a.an.getByteTimeDomainData(a.buf);
    let sum = 0;
    for (let i = 0; i < a.buf.length; i++) { const v = (a.buf[i] - 128) / 128; sum += v * v; }
    const loud = Math.sqrt(sum / a.buf.length) > 0.02;
    const silent = id === myId() && voice.muted;
    if (loud && !silent && !voice.localMute.has(id)) a.until = now + 350;
    const on = a.until > now;
    if (on !== voice.speaking.has(id)) { on ? voice.speaking.add(id) : voice.speaking.delete(id); changed = true; }
  }
  if (changed) paintTalking();
}, 150);

async function getMic() {
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
}

async function joinVoice(want) {
  if (!session || voice.busy) return;
  voice.busy = true;
  try {
    let mode = isSpecNow() ? 'listen' : want;
    closeAllPeers();
    if (voice.stream) { voice.stream.getTracks().forEach((t) => t.stop()); voice.stream = null; unwatch(myId()); }
    if (mode === 'talk') {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
        voice.stream = await getMic();
      } catch (e) {
        toast(location.protocol === 'http:' && location.hostname !== 'localhost' ? 'ไมค์ใช้ได้เฉพาะเว็บ https' : 'เปิดไมค์ไม่ได้ (ตรวจสอบสิทธิ์ไมค์ในเบราว์เซอร์) เข้าโหมดฟังอย่างเดียวแทน');
        mode = 'listen';
      }
    }
    ensureCtx();
    voice.mode = mode; voice.muted = false; voice.fails.clear();
    if (voice.stream) watchStream(myId(), voice.stream);
    await getIce();
    await api('voice', { ...session, mode, muted: false });
  } catch (e) { voice.mode = 'off'; }
  voice.busy = false;
  renderMic(); refreshVoiceUI(); syncVoice();
}

function leaveVoice(silent) {
  const was = voice.mode !== 'off';
  closeAllPeers();
  if (voice.stream) { voice.stream.getTracks().forEach((t) => t.stop()); voice.stream = null; }
  for (const id of [...voice.analysers.keys()]) unwatch(id);
  voice.mode = 'off'; voice.muted = false; voice.orphans.clear(); voice.fails.clear(); voice.needTap = false;
  if (was && !silent && session) api('voice', { ...session, mode: 'off' }).catch(() => {});
  renderMic();
}

function toggleMute() {
  if (voice.mode !== 'talk' || !voice.stream) return;
  voice.muted = !voice.muted;
  voice.stream.getAudioTracks().forEach((t) => { t.enabled = !voice.muted; });
  if (voice.muted) { voice.speaking.delete(myId()); paintTalking(); }
  api('voice', { ...session, mode: 'talk', muted: voice.muted }).catch(() => {});
  renderMic();
}

// ----- เชื่อมต่อกับแต่ละคน -----
function sendSignal(to, data) {
  voice.chain = voice.chain.then(() => fetch('/api/signal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...session, to, data }),
  }).catch(() => {}));
}

function closePeer(id) {
  const p = voice.peers.get(id);
  if (!p) return;
  voice.peers.delete(id);
  p.closed = true;
  clearTimeout(p.timer);
  try { p.pc.ontrack = p.pc.onicecandidate = p.pc.onconnectionstatechange = null; p.pc.close(); } catch (e) { /* noop */ }
  if (p.audio) { try { p.audio.pause(); p.audio.srcObject = null; p.audio.remove(); } catch (e) { /* noop */ } }
  unwatch(id);
}
function closeAllPeers() { for (const id of [...voice.peers.keys()]) closePeer(id); }

function newPeer(id, remoteMode) {
  const pc = new RTCPeerConnection({ iceServers: voice.ice || [{ urls: 'stun:stun.l.google.com:19302' }] });
  const p = { id, pc, sid: Math.random().toString(36).slice(2, 10), remoteSid: null, remoteMode, pending: [], haveRemote: false, status: 'connecting', audio: null, closed: false, timer: null };
  voice.peers.set(id, p);
  pc.onicecandidate = (e) => { if (e.candidate) sendSignal(id, { t: 'ice', sid: p.sid, for: p.remoteSid || undefined, c: e.candidate }); };
  pc.ontrack = (e) => attachRemote(p, e.streams && e.streams[0] ? e.streams[0] : new MediaStream([e.track]));
  pc.onconnectionstatechange = () => onPeerState(p);
  return p;
}

function attachRemote(p, stream) {
  if (!p.audio) {
    const a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true; a.setAttribute('playsinline', '');
    a.style.display = 'none';
    document.body.appendChild(a);
    p.audio = a;
  }
  p.audio.srcObject = stream;
  p.audio.muted = voice.localMute.has(p.id);
  const pl = p.audio.play();
  if (pl && pl.catch) pl.catch(() => { voice.needTap = true; refreshVoiceUI(); });
  watchStream(p.id, stream);
}
// iOS บางทีไม่ยอมเล่นเสียงจนกว่าจะแตะหน้าจอ
document.addEventListener('click', () => {
  if (voice.mode === 'off') return;
  ensureCtx();
  voice.peers.forEach((p) => { if (p.audio && p.audio.paused) p.audio.play().then(() => { voice.needTap = false; refreshVoiceUI(); }).catch(() => {}); });
}, true);

function addLocalTracks(p, offerer) {
  if (voice.mode === 'talk' && voice.stream) {
    voice.stream.getAudioTracks().forEach((t) => p.pc.addTrack(t, voice.stream));
  } else if (offerer) {
    p.pc.addTransceiver('audio', { direction: 'recvonly' });
  }
}

async function startCall(id, remoteMode) {
  const p = newPeer(id, remoteMode);
  try {
    addLocalTracks(p, true);
    const offer = await p.pc.createOffer();
    await p.pc.setLocalDescription(offer);
    if (p.closed) return;
    sendSignal(id, { t: 'offer', sid: p.sid, sdp: p.pc.localDescription.sdp });
  } catch (e) { setPeerStatus(p, 'bad'); }
}

async function onSignal(msg) {
  if (voice.mode === 'off' || !msg || !msg.data) return;
  const { from, data } = msg;
  let p = voice.peers.get(from);
  try {
    if (data.t === 'offer') {
      if (p && p.remoteSid === data.sid) return;      // ซ้ำ
      if (p) closePeer(from);
      const v = vmember(from);
      p = newPeer(from, v ? v.mode : 'talk');
      p.remoteSid = data.sid;
      await p.pc.setRemoteDescription({ type: 'offer', sdp: data.sdp });
      if (p.closed) return;
      addLocalTracks(p, false);
      const ans = await p.pc.createAnswer();
      await p.pc.setLocalDescription(ans);
      p.haveRemote = true;
      const early = (voice.orphans.get(from) || []).filter((o) => o.sid === data.sid);
      voice.orphans.delete(from);
      early.forEach((o) => p.pending.push(o.c));
      sendSignal(from, { t: 'answer', sid: p.sid, for: data.sid, sdp: p.pc.localDescription.sdp });
      flushPending(p);
    } else if (data.t === 'answer') {
      if (!p || data.for !== p.sid || p.remoteSid) return;
      p.remoteSid = data.sid;
      await p.pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
      p.haveRemote = true;
      flushPending(p);
    } else if (data.t === 'ice') {
      if (!p) {                                        // มาก่อน offer เก็บไว้ก่อน
        const list = voice.orphans.get(from) || [];
        if (list.length < 40) list.push({ sid: data.sid, c: data.c });
        voice.orphans.set(from, list);
        return;
      }
      if (data.for && data.for !== p.sid) return;       // ของรอบเก่า
      if (p.remoteSid && data.sid !== p.remoteSid) return;
      p.pending.push(data.c);
      if (p.haveRemote) flushPending(p);
    }
  } catch (e) { if (p) setPeerStatus(p, 'bad'); }
}

function flushPending(p) {
  const list = p.pending.splice(0);
  list.forEach((c) => { p.pc.addIceCandidate(c).catch(() => {}); });
}

function setPeerStatus(p, st) {
  if (p.status === st) return;
  p.status = st;
  refreshVoiceUI();
}

function onPeerState(p) {
  if (p.closed) return;
  const st = p.pc.connectionState;
  if (st === 'connected') { voice.fails.delete(p.id); setPeerStatus(p, 'ok'); }
  else if (st === 'failed') {
    const n = (voice.fails.get(p.id) || 0) + 1;
    voice.fails.set(p.id, n);
    closePeer(p.id);
    if (n >= 3) { toast('ต่อเสียงกับ ' + nameOf(p.id) + ' ไม่ได้ (เครือข่ายอาจบล็อก)'); const dead = { id: p.id, status: 'bad', dead: true, pc: { close() {} }, closed: false }; voice.peers.set(p.id, dead); refreshVoiceUI(); return; }
    setTimeout(syncVoice, 1500);
  }
}

// เทียบรายชื่อห้องเสียงจากเซิร์ฟเวอร์กับสายที่ต่ออยู่
function syncVoice() {
  if (voice.mode === 'off' || !state || voice.busy) return;
  const me = vmember(myId());
  if (!me) { rejoinVoice(); return; }
  const others = (state.voice || []).filter((m) => m.id !== myId());
  const ids = new Set(others.map((m) => m.id));
  for (const id of [...voice.peers.keys()]) if (!ids.has(id)) closePeer(id);
  for (const id of [...voice.orphans.keys()]) if (!ids.has(id)) voice.orphans.delete(id);
  for (const m of others) {
    const need = voice.mode === 'talk' || m.mode === 'talk';
    let p = voice.peers.get(m.id);
    if (p && (p.remoteMode !== m.mode || !need)) { voice.fails.delete(m.id); closePeer(m.id); p = null; }
    if (!need || p) continue;
    if ((voice.fails.get(m.id) || 0) >= 3) continue;
    if (myId() < m.id) startCall(m.id, m.mode);          // id น้อยกว่าเป็นฝ่ายโทรหา
    // ฝ่ายอื่นรอ offer (สร้าง peer ตอนได้รับ)
  }
  // เมื่อโหมดเปลี่ยน ปรับ remoteMode ของสายที่รออยู่
  for (const p of voice.peers.values()) { const m = vmember(p.id); if (m) p.remoteMode = m.mode; }
}

let rejoining = false;
async function rejoinVoice() {
  if (rejoining || !session) return;
  rejoining = true;
  try {
    closeAllPeers();
    let mode = voice.mode;
    if (mode === 'talk' && (!voice.stream || voice.stream.getAudioTracks().every((t) => t.readyState === 'ended'))) {
      try { voice.stream = await getMic(); watchStream(myId(), voice.stream); } catch (e) { mode = 'listen'; voice.mode = 'listen'; }
    }
    if (voice.stream) voice.stream.getAudioTracks().forEach((t) => { t.enabled = !voice.muted; });
    await api('voice', { ...session, mode, muted: mode === 'talk' && voice.muted });
  } catch (e) { /* ลองใหม่รอบถัดไป */ }
  setTimeout(() => { rejoining = false; }, 1500);
}

// ----- หน้าตา -----
function renderMic() {
  const b = $('#btnMic'); if (!b) return;
  const spec = isSpecNow();
  b.classList.remove('mic-on', 'mic-muted', 'mic-listen');
  if (voice.mode === 'talk') { b.classList.add(voice.muted ? 'mic-muted' : 'mic-on'); b.textContent = voice.muted ? '🔇' : '🎤'; }
  else if (voice.mode === 'listen') { b.classList.add('mic-listen'); b.textContent = '🎧'; }
  else b.textContent = spec ? '🎧' : '🎤';
}
$('#btnMic').onclick = () => {
  if (!session) return;
  if (voice.mode === 'off') joinVoice(isSpecNow() ? 'listen' : 'talk');
  else if (voice.mode === 'talk') toggleMute();
  else if (isSpecNow()) leaveVoice();
  else joinVoice('talk');
};

function refreshVoiceUI() {
  renderMic();
  if ($('#drawer').classList.contains('on') && (drawerTab === 'room' || drawerTab === 'coin') && state) renderDrawer();
}

function voiceBoxHTML(s) {
  const spec = !!(s.you && s.you.spectator);
  const list = (s.voice || []);
  const on = voice.mode !== 'off';
  const rows = list.map((m) => {
    const self = m.id === s.you.id;
    const p = voice.peers.get(m.id);
    let st = '';
    if (!self && on) {
      if (!(voice.mode === 'talk' || m.mode === 'talk')) st = '<small>ฟังอยู่ทั้งคู่</small>';
      else if (p && p.status === 'ok') st = '<small class="ok">เชื่อมต่อแล้ว</small>';
      else if (p && p.status === 'bad') st = '<small class="bad">ต่อไม่ได้</small>';
      else st = '<small>กำลังเชื่อมต่อ…</small>';
    }
    const icon = m.mode === 'listen' ? '🎧' : m.muted ? '🔇' : '🎤';
    const mute = !self && on ? `<button class="b sm ghost" data-vmute="${m.id}">${voice.localMute.has(m.id) ? '🔈 เปิดเสียงเขา' : '🔇 ปิดเสียงเขา'}</button>` : '';
    return `<div class="vr"><span>${icon}</span><span class="grow">${esc(m.name)}${self ? ' (คุณ)' : ''} ${st}</span>${mute}</div>`;
  }).join('');
  const btns = !on
    ? (spec ? '<button class="b green full" data-vjoin="listen">🎧 เข้าไปฟัง</button>'
      : '<button class="b green full" data-vjoin="talk">🎤 เข้าห้องเสียง (พูดได้)</button><button class="b ghost full" style="margin-top:8px" data-vjoin="listen">🎧 ฟังอย่างเดียว</button>')
    : `<button class="b ghost full" data-vleave="1">ออกจากห้องเสียง</button>${voice.mode === 'listen' && !spec ? '<button class="b green full" style="margin-top:8px" data-vjoin="talk">🎤 เปิดไมค์พูด</button>' : ''}`;
  return `<div class="vbox"><h4>🎤 ห้องเสียง</h4>${rows || '<p class="hint" style="margin:4px 0">ยังไม่มีใครในห้องเสียง</p>'}
    <div style="margin-top:8px">${btns}</div>
    ${voice.needTap ? '<p class="tip">แตะหน้าจอหนึ่งครั้งเพื่อเปิดเสียง</p>' : ''}
    <p class="tip">${spec ? 'ผู้ชมฟังได้อย่างเดียว' : 'ไมค์ปิดไว้จนกว่าจะกดเข้า · กดปุ่ม 🎤 ด้านบนเพื่อปิด/เปิดไมค์ · แนะนำให้ใส่หูฟังกันเสียงสะท้อน'}</p></div>`;
}
function bindVoiceBox(root) {
  root.querySelectorAll('[data-vjoin]').forEach((b) => { b.onclick = () => joinVoice(b.dataset.vjoin); });
  root.querySelectorAll('[data-vleave]').forEach((b) => { b.onclick = () => { leaveVoice(); renderDrawer(); }; });
  root.querySelectorAll('[data-vmute]').forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.vmute;
      if (voice.localMute.has(id)) voice.localMute.delete(id); else voice.localMute.add(id);
      const p = voice.peers.get(id); if (p && p.audio) p.audio.muted = voice.localMute.has(id);
      if (voice.localMute.has(id)) { voice.speaking.delete(id); paintTalking(); }
      renderDrawer();
    };
  });
}

// ---------- เริ่มต้น ----------
(function init() {
  const saved = JSON.parse(ls('pp_session') || 'null');
  if (saved && saved.code && saved.token && !(urlRoom && urlRoom.toUpperCase() !== saved.code)) {
    session = saved; show('game'); connect();
  } else show('home');
})();
</script>
